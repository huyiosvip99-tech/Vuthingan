<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>AI KHẢI TƯỜNG — Đọc văn bản</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#03050f;
  --bg2:#060a1a;
  --glass:rgba(8,14,36,.75);
  --glass2:rgba(12,20,50,.6);
  --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12);
  --text:#f0f4ff;
  --muted:#6b7fa3;
  --muted2:#4a5878;

  --blue:#4d7cff;
  --blue2:#6690ff;
  --cyan:#00d4ff;
  --purple:#8855ff;
  --purple2:#a066ff;
  --green:#00e676;
  --red:#ff3d3d;
  --pink:#ff3daa;

  --glow-blue:rgba(77,124,255,.18);
  --glow-purple:rgba(136,85,255,.14);
  --glow-cyan:rgba(0,212,255,.1);
}

html{background:var(--bg)}

body{
  min-height:100vh;
  font-family:'Inter',sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse 80% 40% at 10% -10%, rgba(77,124,255,.12) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 5%, rgba(136,85,255,.10) 0%, transparent 55%),
    radial-gradient(ellipse 100% 60% at 50% 110%, rgba(0,212,255,.07) 0%, transparent 50%),
    var(--bg);
  overflow-x:hidden;
}

/* Subtle grid */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:linear-gradient(180deg, rgba(0,0,0,.6) 0%, transparent 70%);
}

/* Ambient orbs */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle 300px at 20% 30%, rgba(77,124,255,.06), transparent),
    radial-gradient(circle 250px at 80% 60%, rgba(136,85,255,.06), transparent);
}

.app{
  position:relative;z-index:1;
  width:min(760px,94%);
  margin:0 auto;
  padding:40px 0 80px;
}

/* ============ HEADER ============ */
.header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:36px;
  padding:0 4px;
}

.brand{display:flex;align-items:center;gap:16px}

.logo{
  position:relative;
  width:52px;height:52px;
  border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  background:linear-gradient(145deg, rgba(77,124,255,.25), rgba(136,85,255,.2));
  border:1px solid rgba(77,124,255,.35);
  box-shadow:
    0 0 0 1px rgba(77,124,255,.1),
    0 0 30px rgba(77,124,255,.2),
    inset 0 1px 0 rgba(255,255,255,.1);
}

.logo::after{
  content:"";position:absolute;inset:0;border-radius:18px;
  background:linear-gradient(145deg, rgba(255,255,255,.08), transparent 60%);
}

.logo i{position:relative;z-index:1;
  background:linear-gradient(135deg, var(--blue2), var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.brand-text h1{
  font-size:20px;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(135deg, #e0eaff 0%, #a0b8ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.brand-text p{color:var(--muted);font-size:11px;margin-top:3px;letter-spacing:.02em}

.badge-live{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;
  background:rgba(0,230,118,.06);
  border:1px solid rgba(0,230,118,.2);
  border-radius:999px;
  font-size:10px;font-weight:700;letter-spacing:.08em;color:#00e676;
}
.badge-live::before{
  content:"";width:6px;height:6px;border-radius:50%;
  background:#00e676;
  box-shadow:0 0 8px #00e676;
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ============ CARD STACK ============ */
.card{
  position:relative;
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:28px;
  padding:26px;
  margin-bottom:14px;
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  overflow:hidden;
  transition:border-color .3s, box-shadow .3s;
}

.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.15) 30%, rgba(255,255,255,.25) 50%, rgba(255,255,255,.15) 70%, transparent 100%);
}

/* Card accent strip left */
.card.accent-blue::after{
  content:"";position:absolute;left:0;top:20%;bottom:20%;width:2px;border-radius:2px;
  background:linear-gradient(180deg, transparent, var(--blue), transparent);
  box-shadow:0 0 12px var(--blue);
}
.card.accent-purple::after{
  content:"";position:absolute;left:0;top:20%;bottom:20%;width:2px;border-radius:2px;
  background:linear-gradient(180deg, transparent, var(--purple), transparent);
  box-shadow:0 0 12px var(--purple);
}
.card.accent-cyan::after{
  content:"";position:absolute;left:0;top:20%;bottom:20%;width:2px;border-radius:2px;
  background:linear-gradient(180deg, transparent, var(--cyan), transparent);
  box-shadow:0 0 12px var(--cyan);
}
.card.accent-green::after{
  content:"";position:absolute;left:0;top:20%;bottom:20%;width:2px;border-radius:2px;
  background:linear-gradient(180deg, transparent, var(--green), transparent);
  box-shadow:0 0 12px var(--green);
}

/* Card label */
.card-label{
  display:flex;align-items:center;gap:8px;
  margin-bottom:18px;
}
.card-label-icon{
  width:30px;height:30px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
}
.icon-blue{background:rgba(77,124,255,.15);color:var(--blue2);border:1px solid rgba(77,124,255,.25)}
.icon-purple{background:rgba(136,85,255,.15);color:var(--purple2);border:1px solid rgba(136,85,255,.25)}
.icon-cyan{background:rgba(0,212,255,.12);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}
.icon-green{background:rgba(0,230,118,.1);color:var(--green);border:1px solid rgba(0,230,118,.2)}

.card-label-title{font-size:13px;font-weight:700;color:#c4d0f0;letter-spacing:.01em}
.card-label-sub{margin-left:auto;font-size:10px;color:var(--muted);letter-spacing:.04em}

/* ============ TEXTAREA ============ */
.txt-wrap{position:relative}

textarea{
  width:100%;min-height:200px;resize:vertical;
  background:rgba(2,5,20,.6);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:18px;
  color:var(--text);font-family:'Inter',sans-serif;
  font-size:14px;line-height:1.75;
  outline:none;
  transition:.25s;
  caret-color:var(--blue2);
}
textarea::placeholder{color:rgba(107,127,163,.5);font-size:13px}
textarea:focus{
  border-color:rgba(77,124,255,.4);
  box-shadow:0 0 0 3px rgba(77,124,255,.07), 0 0 20px rgba(77,124,255,.06);
  background:rgba(2,5,24,.7);
}

.txt-footer{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:10px;padding:0 2px;
}
.txt-counter{font-size:11px;color:var(--muted2);letter-spacing:.03em}
.txt-actions{display:flex;gap:8px}

.chip-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:8px;border:1px solid var(--line2);
  background:rgba(255,255,255,.03);color:var(--muted);
  font-size:11px;font-weight:600;cursor:pointer;
  transition:.2s;font-family:'Inter',sans-serif;
}
.chip-btn:hover{background:rgba(255,255,255,.07);color:var(--text);border-color:var(--line2)}
.chip-btn.danger:hover{background:rgba(255,61,61,.08);color:var(--red);border-color:rgba(255,61,61,.25)}

/* ============ MIC SECTION ============ */
.mic-row{
  display:flex;align-items:center;gap:14px;
  margin-top:16px;
  padding:14px 18px;
  background:rgba(77,124,255,.05);
  border:1px solid rgba(77,124,255,.12);
  border-radius:16px;
  transition:.3s;
}
.mic-row.active{
  background:rgba(255,61,61,.06);
  border-color:rgba(255,61,61,.2);
}

.mic-orb{
  position:relative;
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(77,124,255,.1);
  border:1px solid rgba(77,124,255,.3);
  color:var(--blue2);font-size:16px;
  cursor:pointer;transition:.25s;
}
.mic-orb::before{
  content:"";position:absolute;inset:-1px;border-radius:50%;
  background:linear-gradient(135deg, rgba(77,124,255,.2), transparent);
  opacity:0;transition:.3s;
}
.mic-orb:hover::before{opacity:1}
.mic-orb:hover{border-color:rgba(77,124,255,.6);box-shadow:0 0 20px rgba(77,124,255,.25)}

.mic-orb.rec{
  background:rgba(255,61,61,.1);
  border-color:rgba(255,61,61,.45);
  color:var(--red);
  animation:orbPulse 1.4s ease-in-out infinite;
}
@keyframes orbPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,61,61,.3)}
  50%{box-shadow:0 0 0 12px rgba(255,61,61,0)}
}

.mic-info{flex:1;min-width:0}
.mic-info-label{font-size:11px;font-weight:700;color:#8899cc;margin-bottom:2px;letter-spacing:.04em}
.mic-info-status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.2s}
.mic-info-status.on{color:#4ade80}
.mic-info-status.err{color:var(--red)}

.mic-bars{display:flex;align-items:center;gap:3px;height:28px;opacity:0;transition:opacity .3s}
.mic-bars.show{opacity:1}
.mic-bar{width:3px;border-radius:3px;background:linear-gradient(to top, var(--red), #ff8888);height:4px;transition:height .1s}

/* ============ VOICES ============ */
.voice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.voice-card{
  padding:14px;border-radius:16px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(5,8,25,.5);
  cursor:pointer;transition:.2s;
}
.voice-card:hover{border-color:rgba(77,124,255,.3);background:rgba(77,124,255,.05)}
.voice-card.sel{
  border-color:var(--blue);
  background:rgba(77,124,255,.08);
  box-shadow:0 0 20px rgba(77,124,255,.06), inset 0 1px 0 rgba(77,124,255,.1);
}

.vc-top{display:flex;align-items:center;gap:12px}
.vc-avatar{
  width:40px;height:40px;border-radius:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;
  background:linear-gradient(135deg, rgba(77,124,255,.3), rgba(136,85,255,.25));
  border:1px solid rgba(77,124,255,.3);
  color:var(--blue2);
  box-shadow:0 4px 14px rgba(77,124,255,.12);
}
.vc-name{font-size:13px;font-weight:700;color:#dae4ff}
.vc-lang{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.04em}

/* ============ SLIDERS ============ */
.slider-list{display:flex;flex-direction:column;gap:16px}

.slider-row{
  display:grid;grid-template-columns:110px 1fr 52px;
  align-items:center;gap:14px;
}
.slider-label{
  display:flex;align-items:center;gap:7px;
  font-size:12px;color:#8899bb;font-weight:500;
}
.slider-label i{font-size:12px;color:var(--muted2)}

input[type=range]{
  -webkit-appearance:none;width:100%;height:4px;
  background:rgba(255,255,255,.08);border-radius:4px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:linear-gradient(135deg, var(--blue2), var(--purple));
  border:2px solid rgba(255,255,255,.2);
  box-shadow:0 0 10px rgba(77,124,255,.4);
  cursor:pointer;transition:.15s;
}
input[type=range]::-webkit-slider-thumb:hover{
  transform:scale(1.15);box-shadow:0 0 16px rgba(77,124,255,.6);
}
input[type=range]:focus{outline:none}

.slider-val{
  font-size:12px;font-weight:700;text-align:right;
  color:var(--blue2);letter-spacing:.02em;
}

/* ============ PLAYER ============ */
.wave-vis{
  height:52px;display:flex;align-items:center;justify-content:center;gap:4px;
  margin-bottom:18px;
}
.w-bar{
  width:4px;border-radius:4px;height:5px;
  background:linear-gradient(to top, var(--blue), var(--cyan));
  opacity:.25;transition:height .08s;
}
.wave-vis.playing .w-bar{
  animation:waveAnim .6s ease-in-out infinite alternate;
  opacity:.9;
}
.w-bar:nth-child(2){animation-delay:.08s}
.w-bar:nth-child(3){animation-delay:.16s}
.w-bar:nth-child(4){animation-delay:.24s}
.w-bar:nth-child(5){animation-delay:.12s}
.w-bar:nth-child(6){animation-delay:.28s}
.w-bar:nth-child(7){animation-delay:.18s}
.w-bar:nth-child(8){animation-delay:.32s}
.w-bar:nth-child(9){animation-delay:.08s}
.w-bar:nth-child(10){animation-delay:.22s}
@keyframes waveAnim{from{height:4px}to{height:36px}}

/* Player actions */
.player-actions{display:grid;grid-template-columns:1fr 52px 52px;gap:10px;margin-bottom:14px}

.btn-play{
  height:52px;border-radius:16px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:700;
  color:white;letter-spacing:.01em;
  background:linear-gradient(135deg, #4d7cff 0%, #8855ff 100%);
  box-shadow:0 8px 32px rgba(77,124,255,.3), 0 2px 8px rgba(0,0,0,.3),
             inset 0 1px 0 rgba(255,255,255,.15);
  transition:.2s;position:relative;overflow:hidden;
}
.btn-play::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,.08), transparent 60%);
}
.btn-play:hover{transform:translateY(-1px);box-shadow:0 12px 40px rgba(77,124,255,.4), 0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.15)}
.btn-play:active{transform:translateY(0)}

.btn-ctrl{
  height:52px;width:52px;border-radius:14px;border:1px solid var(--line2);
  background:rgba(255,255,255,.04);color:var(--muted);
  cursor:pointer;font-size:15px;transition:.2s;font-family:'Inter',sans-serif;
}
.btn-ctrl:hover{background:rgba(255,255,255,.09);color:var(--text);border-color:rgba(255,255,255,.18)}

/* Status bar */
.status-row{display:flex;align-items:center;gap:8px;padding:0 2px}
.status-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--muted2);transition:.3s;
}
.status-dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
.status-text{font-size:11px;color:var(--muted);letter-spacing:.02em}

/* ============ FOOTER ============ */
.footer{
  text-align:center;padding-top:10px;
  font-size:10px;color:rgba(107,127,163,.4);letter-spacing:.06em;
}

/* ============ MOBILE ============ */
@media(max-width:640px){
  .app{width:94%;padding-top:24px}
  .card{padding:18px;border-radius:22px}
  .voice-grid{grid-template-columns:1fr}
  .slider-row{grid-template-columns:90px 1fr 44px}
  .brand-text h1{font-size:17px}
  .badge-live{display:none}
}
</style>
</head>

<body>
<div class="app">

<!-- HEADER -->
<header class="header">
  <div class="brand">
    <div class="logo"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <div class="brand-text">
      <h1>AI KHẢI TƯỜNG</h1>
      <p>Trợ lý đọc văn bản thông minh</p>
    </div>
  </div>
  <div class="badge-live">AI VOICE</div>
</header>


<!-- CARD 1: VĂN BẢN -->
<div class="card accent-blue">
  <div class="card-label">
    <div class="card-label-icon icon-blue"><i class="fa-solid fa-file-lines"></i></div>
    <span class="card-label-title">Nhập văn bản</span>
    <span class="card-label-sub" id="counter">0 ký tự</span>
  </div>

  <div class="txt-wrap">
    <textarea id="txt" 
      placeholder="Nhập hoặc dán văn bản cần đọc vào đây..."></textarea>
  </div>

  <div class="txt-footer">
    <span class="txt-counter">Không giới hạn ký tự</span>
    <div class="txt-actions">
      <button class="chip-btn" onclick="pasteTxt()">
        <i class="fa-solid fa-clipboard"></i> Dán
      </button>
      <button class="chip-btn danger" onclick="clearText()">
        <i class="fa-solid fa-eraser"></i> Xóa
      </button>
    </div>
  </div>

  <!-- MIC -->
  <div class="mic-row" id="micRow">
    <div class="mic-orb" id="micOrb" onclick="toggleMic()">
      <i class="fa-solid fa-microphone" id="micIcon"></i>
    </div>
    <div class="mic-info">
      <div class="mic-info-label">NHẬP BẰNG GIỌNG NÓI</div>
      <div class="mic-info-status" id="micStatus">Nhấn để bắt đầu nói</div>
    </div>
    <div class="mic-bars" id="micBars">
      <div class="mic-bar" id="mb1"></div>
      <div class="mic-bar" id="mb2"></div>
      <div class="mic-bar" id="mb3"></div>
      <div class="mic-bar" id="mb4"></div>
      <div class="mic-bar" id="mb5"></div>
    </div>
  </div>
</div>


<!-- CARD 2: GIỌNG ĐỌC -->
<div class="card accent-purple">
  <div class="card-label">
    <div class="card-label-icon icon-purple"><i class="fa-solid fa-microphone-lines"></i></div>
    <span class="card-label-title">Giọng đọc</span>
    <span class="card-label-sub" id="voiceStatus">Đang tải...</span>
  </div>
  <div class="voice-grid" id="voiceGrid"></div>
</div>


<!-- CARD 3: ĐIỀU CHỈNH -->
<div class="card accent-cyan">
  <div class="card-label">
    <div class="card-label-icon icon-cyan"><i class="fa-solid fa-sliders"></i></div>
    <span class="card-label-title">Điều chỉnh</span>
  </div>
  <div class="slider-list">
    <div class="slider-row">
      <div class="slider-label"><i class="fa-solid fa-gauge-high"></i> Tốc độ</div>
      <input id="rate" type="range" min=".5" max="2" step=".1" value="1" oninput="updateSettings()">
      <span class="slider-val" id="rateV">1.0×</span>
    </div>
    <div class="slider-row">
      <div class="slider-label"><i class="fa-solid fa-music"></i> Âm vực</div>
      <input id="pitch" type="range" min="0" max="2" step=".1" value="1" oninput="updateSettings()">
      <span class="slider-val" id="pitchV">1.0</span>
    </div>
    <div class="slider-row">
      <div class="slider-label"><i class="fa-solid fa-volume-high"></i> Âm lượng</div>
      <input id="volume" type="range" min="0" max="1" step=".05" value="1" oninput="updateSettings()">
      <span class="slider-val" id="volumeV">100%</span>
    </div>
  </div>
</div>


<!-- CARD 4: PLAYER -->
<div class="card accent-green">
  <div class="wave-vis" id="waveVis">
    <div class="w-bar"></div><div class="w-bar"></div><div class="w-bar"></div>
    <div class="w-bar"></div><div class="w-bar"></div><div class="w-bar"></div>
    <div class="w-bar"></div><div class="w-bar"></div><div class="w-bar"></div>
    <div class="w-bar"></div>
  </div>

  <div class="player-actions">
    <button class="btn-play" onclick="speak()">
      <i class="fa-solid fa-play" id="playIcon"></i>
      <span id="playText">Phát văn bản</span>
    </button>
    <button class="btn-ctrl" onclick="pauseResume()" title="Tạm dừng">
      <i class="fa-solid fa-pause" id="pauseIcon"></i>
    </button>
    <button class="btn-ctrl" onclick="stopSpeech()" title="Dừng">
      <i class="fa-solid fa-stop"></i>
    </button>
  </div>

  <div class="status-row">
    <div class="status-dot" id="dot"></div>
    <span class="status-text" id="statusText">Sẵn sàng phát</span>
  </div>
</div>


<div class="footer">AI KHẢI TƯỜNG &nbsp;·&nbsp; TEXT TO SPEECH</div>

</div><!-- /app -->

<script>
/* ===== SYNTH ===== */
const synth = window.speechSynthesis;
let voices = [], selectedVoice = null;
const textarea = document.getElementById("txt");

textarea.addEventListener("input", updateCounter);

function updateCounter(){
  document.getElementById("counter").textContent =
    textarea.value.length.toLocaleString("vi-VN") + " ký tự";
}

async function pasteTxt(){
  try{
    const t = await navigator.clipboard.readText();
    if(t){ textarea.value = (textarea.value + t); updateCounter(); }
  } catch(e){ textarea.focus(); document.execCommand("paste"); }
}

function clearText(){ textarea.value = ""; updateCounter(); }

function loadVoices(){
  voices = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("vi"));
  const grid = document.getElementById("voiceGrid");
  grid.innerHTML = "";
  if(!voices.length){
    grid.innerHTML = `<div style="grid-column:1/-1;padding:16px 0;font-size:12px;color:#6b7fa3">
      Trình duyệt chưa hỗ trợ giọng Tiếng Việt. Hãy dùng Edge hoặc Chrome.</div>`;
    document.getElementById("voiceStatus").textContent = "Không tìm thấy";
    return;
  }
  document.getElementById("voiceStatus").textContent = voices.length + " giọng";
  voices.forEach((voice,i) => {
    const card = document.createElement("div");
    card.className = "voice-card" + (i===0?" sel":"");
    card.innerHTML = `<div class="vc-top">
      <div class="vc-avatar">K</div>
      <div><div class="vc-name">AI KHẢI TƯỜNG</div><div class="vc-lang">${voice.lang}</div></div>
    </div>`;
    card.onclick = () => {
      document.querySelectorAll(".voice-card").forEach(c => c.classList.remove("sel"));
      card.classList.add("sel"); selectedVoice = voice;
    };
    grid.appendChild(card);
  });
  selectedVoice = voices[0];
}

loadVoices();
if(synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

function updateSettings(){
  const r = parseFloat(document.getElementById("rate").value);
  const p = parseFloat(document.getElementById("pitch").value);
  const v = parseFloat(document.getElementById("volume").value);
  document.getElementById("rateV").textContent   = r.toFixed(1)+"×";
  document.getElementById("pitchV").textContent  = p.toFixed(1);
  document.getElementById("volumeV").textContent = Math.round(v*100)+"%";
}

function speak(){
  const text = textarea.value.trim();
  if(!text){ flashStatus("Chưa có văn bản để đọc"); return; }
  if(!("speechSynthesis" in window)){ flashStatus("Trình duyệt không hỗ trợ"); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(selectedVoice) u.voice = selectedVoice;
  u.lang   = "vi-VN";
  u.rate   = parseFloat(document.getElementById("rate").value);
  u.pitch  = parseFloat(document.getElementById("pitch").value);
  u.volume = parseFloat(document.getElementById("volume").value);
  u.onstart = () => setPlaying(true);
  u.onend   = () => setPlaying(false);
  u.onerror = () => setPlaying(false);
  synth.speak(u);
}

function pauseResume(){
  if(!synth.speaking) return;
  if(synth.paused){
    synth.resume(); setPlaying(true);
    document.getElementById("pauseIcon").className = "fa-solid fa-pause";
  } else {
    synth.pause(); setPlaying(false);
    document.getElementById("statusText").textContent = "Đang tạm dừng";
    document.getElementById("pauseIcon").className = "fa-solid fa-play";
  }
}

function stopSpeech(){
  synth.cancel(); setPlaying(false);
  document.getElementById("pauseIcon").className = "fa-solid fa-pause";
}

function setPlaying(on){
  const wave = document.getElementById("waveVis");
  const dot  = document.getElementById("dot");
  const pi   = document.getElementById("playIcon");
  const pt   = document.getElementById("playText");
  const st   = document.getElementById("statusText");
  if(on){
    wave.classList.add("playing"); dot.classList.add("on");
    pi.className="fa-solid fa-volume-high"; pt.textContent="Đang phát";
    st.textContent="AI KHẢI TƯỜNG đang đọc...";
  } else {
    wave.classList.remove("playing"); dot.classList.remove("on");
    pi.className="fa-solid fa-play"; pt.textContent="Phát văn bản";
    st.textContent="Sẵn sàng phát";
  }
}

function flashStatus(msg){
  const st = document.getElementById("statusText");
  st.textContent = msg;
  setTimeout(() => st.textContent = "Sẵn sàng phát", 2500);
}

/* ===== MIC ===== */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, isRec = false, micWaveInt = null;

function buildRec(){
  if(!SpeechRec) return null;
  const r = new SpeechRec();
  r.lang="vi-VN"; r.interimResults=true; r.continuous=true; r.maxAlternatives=1;
  let final = "";
  r.onstart = () => { setMicOn(true); final=""; };
  r.onresult = e => {
    let interim = "";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=t+" "; else interim=t;
    }
    textarea.value = final + interim;
    updateCounter();
    const disp = (final+interim).trim();
    const s = document.getElementById("micStatus");
    s.textContent = disp.length>58 ? "…"+disp.slice(-58) : (disp||"Đang nghe...");
  };
  r.onerror = e => {
    const m={
      "not-allowed":"Microphone bị từ chối. Cấp quyền trình duyệt.",
      "no-speech":"Không nghe thấy giọng nói.",
      "audio-capture":"Không tìm thấy microphone.",
      "network":"Lỗi mạng.",
    };
    setMicErr(m[e.error]||"Lỗi: "+e.error);
  };
  r.onend = () => {
    if(isRec){ try{r.start()}catch(_){} }
    else setMicOn(false);
  };
  return r;
}

function toggleMic(){
  if(!SpeechRec){ alert("Trình duyệt không hỗ trợ nhận dạng giọng.\nDùng Chrome hoặc Edge."); return; }
  if(isRec){ isRec=false; if(recognition) recognition.stop(); }
  else {
    recognition=buildRec(); isRec=true;
    try{recognition.start()}catch(e){setMicErr("Không bắt đầu được: "+e.message);isRec=false;}
  }
}

function setMicOn(on){
  const orb=document.getElementById("micOrb");
  const icon=document.getElementById("micIcon");
  const row=document.getElementById("micRow");
  const bars=document.getElementById("micBars");
  const status=document.getElementById("micStatus");
  if(on){
    orb.classList.add("rec"); icon.className="fa-solid fa-circle-stop";
    row.classList.add("active"); bars.classList.add("show");
    status.className="mic-info-status on"; status.textContent="Đang nghe — nhấn lại để dừng";
    startMicWave();
  } else {
    orb.classList.remove("rec"); icon.className="fa-solid fa-microphone";
    row.classList.remove("active"); bars.classList.remove("show");
    status.className="mic-info-status"; status.textContent="Nhấn để bắt đầu nói";
    stopMicWave();
  }
}

function setMicErr(msg){
  isRec=false; setMicOn(false);
  const s=document.getElementById("micStatus");
  s.className="mic-info-status err"; s.textContent=msg;
  setTimeout(()=>{ s.className="mic-info-status"; s.textContent="Nhấn để bắt đầu nói"; },4000);
}

function startMicWave(){
  const ids=["mb1","mb2","mb3","mb4","mb5"];
  micWaveInt=setInterval(()=>{
    ids.forEach(id=>{ const el=document.getElementById(id); if(el) el.style.height=(4+Math.random()*20)+"px"; });
  },110);
}
function stopMicWave(){
  clearInterval(micWaveInt);
  ["mb1","mb2","mb3","mb4","mb5"].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.height="4px"; });
}

/* ===== INIT ===== */
updateCounter(); updateSettings();
</script>
